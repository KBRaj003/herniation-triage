name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Buildozer global cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.cache/pip
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Prepare cache directories
        run: mkdir -p "$HOME/.buildozer" "$HOME/.cache/pip"

      - name: Build APK
        run: |
          docker run --rm \
            --volume "$PWD":/home/user/hostcwd \
            --volume "$HOME/.buildozer":/home/user/.buildozer \
            --volume "$HOME/.cache/pip":/home/user/.cache/pip \
            --workdir /home/user/hostcwd \
            kivy/buildozer:latest \
            -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HerniationTriage-Android
          path: bin/*.apk
