name: Build Desktop Executables
"on":
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux system dependencies for Kivy
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libmtdev-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-ttf-dev \
            libsdl2-mixer-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            libx11-dev \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libglib2.0-0

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Patch kivy.garden __path__ (PyInstaller workaround)
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, sysconfig
          init = pathlib.Path(sysconfig.get_paths()["purelib"]) / "kivy" / "garden" / "__init__.py"
          if init.exists():
              txt = init.read_text()
              if "__path__ = 'kivy.garden'" in txt:
                  txt = txt.replace("__path__ = 'kivy.garden'",
                                    "__path__ = [__import__('os').path.dirname(__file__)]")
                  init.write_text(txt); print(f"patched {init}")
              else: print("already patched")
          else: print("kivy.garden not present")
          PY

      - name: Build executable
        run: >
          pyinstaller --onefile --windowed
          --name HerniationTriage
          --hidden-import kivy.core.window
          --collect-data kivy
          --collect-binaries kivy
          --exclude-module kivy.garden
          --exclude-module kivy.input.providers.mtdev
          --exclude-module kivy.input.providers.probesysfs
          main.py

      - uses: actions/upload-artifact@v4
        with:
          name: HerniationTriage-${{ matrix.os }}
          path: dist/*
